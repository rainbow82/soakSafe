# SoakSafe — GitLab CI: Android debug APK + Firebase App Distribution
#
# --- GitLab CI/CD → Variables (Settings → CI/CD → Variables) ---
#
# Required for distribute job:
#   FIREBASE_APP_ID (optional)
#     If unset, CI reads mobilesdk_app_id from app/google-services.json (first Android client).
#     Override via GitLab variable if you use a different Firebase app than that file.
#
#   FIREBASE_SERVICE_ACCOUNT_JSON
#     Service account JSON used by Firebase CLI (App Distribution).
#     Recommended: CI/CD Variable type "File", upload the .json (runner exposes the var as a temp path).
#     Or: Variable type "Variable" with base64-encoded JSON (single line). macOS:
#       base64 -i service-account.json | tr -d '\n' | pbcopy
#     Or: Variable with raw JSON if the value starts with "{" (single-line JSON only).
#
#   FIREBASE_SERVICE_ACCOUNT_B64 (legacy)
#     Same as base64 in FIREBASE_SERVICE_ACCOUNT_JSON; supported if you already created this name.
#
# Optional:
#   FIREBASE_TESTER_GROUPS
#     Comma-separated App Distribution group aliases. Default: testers
#
# The debug build does not require a release keystore. google-services.json must be
# present in the repo under app/ (as in this project).

stages:
  - build
  - distribute

variables:
  ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/.android-sdk"
  ANDROID_HOME: "$CI_PROJECT_DIR/.android-sdk"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"

default:
  interruptible: true

# Speed up repeat pipelines (SDK + Gradle caches).
cache:
  key:
    files:
      - gradle/wrapper/gradle-wrapper.properties
    prefix: android-sdk-35
  paths:
    - .android-sdk
    - .gradle/wrapper
    - .gradle/caches

assemble_debug:
  stage: build
  image: eclipse-temurin:17-jdk
  before_script:
    - apt-get update -qq && apt-get install -y -qq wget unzip > /dev/null
    - chmod +x gradlew
    # Android command-line tools (sdkmanager) — first pipeline run downloads; later runs use cache.
    - mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
    - |
      if [ ! -f "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
        wget -nv -O /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
        rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
        mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
      fi
    - export PATH="$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
    # License files avoid `yes | sdkmanager --licenses` (breaks under bash pipefail when yes gets SIGPIPE).
    - |
      mkdir -p "$ANDROID_SDK_ROOT/licenses"
      printf '%s\n' "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
      printf '%s\n' "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"
    - sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platforms;android-35" "build-tools;35.0.0" > /dev/null
  script:
    - ./gradlew :app:assembleDebug --stacktrace --no-daemon
  artifacts:
    paths:
      - app/build/outputs/apk/debug/app-debug.apk
    expire_in: 14 days

distribute_firebase:
  stage: distribute
  image: node:20-bookworm-slim
  needs:
    - job: assemble_debug
      artifacts: true
  cache: []
  before_script:
    - apt-get update -qq && apt-get install -y -qq ca-certificates > /dev/null
    - npm install -g firebase-tools@13
    - export FIREBASE_APP_ID="${FIREBASE_APP_ID:-$(node -p "require(\"$CI_PROJECT_DIR/app/google-services.json\").client[0].client_info.mobilesdk_app_id")}"
    - 'test -n "$FIREBASE_APP_ID" || (echo "ERROR: Set FIREBASE_APP_ID or commit app/google-services.json with mobilesdk_app_id" && exit 1)'
    - |
      sa_out="$CI_PROJECT_DIR/firebase-sa.json"
      if [ -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ] && [ -f "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
        cp "$FIREBASE_SERVICE_ACCOUNT_JSON" "$sa_out"
      elif [ -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
        case "$FIREBASE_SERVICE_ACCOUNT_JSON" in
          "{"*)
            printf '%s\n' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$sa_out"
            ;;
          *)
            echo "$FIREBASE_SERVICE_ACCOUNT_JSON" | tr -d '\r' | base64 -d > "$sa_out"
            ;;
        esac
      elif [ -n "${FIREBASE_SERVICE_ACCOUNT_B64:-}" ]; then
        echo "$FIREBASE_SERVICE_ACCOUNT_B64" | tr -d '\r' | base64 -d > "$sa_out"
      else
        echo "ERROR: Set FIREBASE_SERVICE_ACCOUNT_JSON (File with SA JSON, or Variable with base64 JSON). Legacy FIREBASE_SERVICE_ACCOUNT_B64 is also accepted." >&2
        exit 1
      fi
      node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$sa_out"
    - export GOOGLE_APPLICATION_CREDENTIALS="$CI_PROJECT_DIR/firebase-sa.json"
  script:
    - |
      GROUPS="${FIREBASE_TESTER_GROUPS:-testers}"
      firebase appdistribution:distribute app/build/outputs/apk/debug/app-debug.apk \
        --app "$FIREBASE_APP_ID" \
        --groups "$GROUPS" \
        --release-notes "SoakSafe build | pipeline ${CI_PIPELINE_IID} | ${CI_COMMIT_SHORT_SHA}"
  rules:
    # School workflow: default integration branch is `working` (not main/master).
    - if: $CI_COMMIT_BRANCH == "working"
