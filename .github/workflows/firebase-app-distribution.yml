# SoakSafe — GitHub Actions: Android debug APK + Firebase App Distribution
#
# --- GitHub → Settings → Secrets and variables → Actions ---
#
# Required:
#   FIREBASE_SERVICE_ACCOUNT_JSON
#     Service account JSON for Firebase CLI (App Distribution).
#     Paste the full JSON as the secret value, OR a single-line base64-encoded JSON:
#       base64 -i service-account.json | tr -d '\n' | pbcopy
#
# Optional:
#   FIREBASE_APP_ID
#     Defaults to mobilesdk_app_id from app/google-services.json when unset.
#   FIREBASE_TESTER_GROUPS
#     Comma-separated App Distribution group aliases (Testers & Groups in Firebase console).
#   FIREBASE_TESTER_EMAILS
#     Comma-separated tester emails (--testers).
#
# Runs on push to `working` (same as the former GitLab pipeline).

name: Firebase App Distribution

on:
  push:
    branches:
      - working
  workflow_dispatch:

concurrency:
  group: firebase-app-distribution-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
  ANDROID_HOME: ${{ github.workspace }}/.android-sdk
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2

jobs:
  assemble_debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Android SDK and Gradle
        uses: actions/cache@v4
        with:
          path: |
            .android-sdk
            .gradle/wrapper
            .gradle/caches
          key: android-sdk-35-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            android-sdk-35-

      - name: Install Android SDK
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          if [ ! -f "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            wget -nv -O /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
            rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          fi
          export PATH="$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          printf '%s\n' "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          printf '%s\n' "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Assemble debug APK
        run: |
          export PATH="$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  distribute_firebase:
    runs-on: ubuntu-latest
    needs: assemble_debug
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13

      - name: Configure Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
        run: |
          set -euo pipefail
          sa_out="${{ github.workspace }}/firebase-sa.json"

          write_sa_from_value() {
            _v="$1"
            case "$_v" in
              "{"*)
                printf '%s\n' "$_v" > "$sa_out"
                ;;
              *)
                echo "$_v" | tr -d '\r' | base64 -d > "$sa_out"
                ;;
            esac
          }

          if [ -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            write_sa_from_value "$FIREBASE_SERVICE_ACCOUNT_JSON"
          elif [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            write_sa_from_value "$FIREBASE_SERVICE_ACCOUNT"
          elif [ -n "${FIREBASE_SERVICE_ACCOUNT_B64:-}" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT_B64" | tr -d '\r' | base64 -d > "$sa_out"
          else
            echo "ERROR: No service account secret found." >&2
            echo "Add FIREBASE_SERVICE_ACCOUNT_JSON under Settings → Secrets and variables → Actions." >&2
            exit 1
          fi

          node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$sa_out"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$sa_out" >> "$GITHUB_ENV"

          if [ -n "${{ secrets.FIREBASE_APP_ID }}" ]; then
            echo "FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}" >> "$GITHUB_ENV"
          else
            app_id="$(node -p "require('${{ github.workspace }}/app/google-services.json').client[0].client_info.mobilesdk_app_id")"
            echo "FIREBASE_APP_ID=$app_id" >> "$GITHUB_ENV"
          fi

      - name: Distribute to Firebase App Distribution
        env:
          FIREBASE_TESTER_GROUPS: ${{ secrets.FIREBASE_TESTER_GROUPS }}
          FIREBASE_TESTER_EMAILS: ${{ secrets.FIREBASE_TESTER_EMAILS }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_APP_ID"

          set -- firebase appdistribution:distribute app/build/outputs/apk/debug/app-debug.apk \
            --app "$FIREBASE_APP_ID" \
            --release-notes "SoakSafe build | run ${GITHUB_RUN_NUMBER} | ${GITHUB_SHA::7}"

          if [ -n "${FIREBASE_TESTER_GROUPS:-}" ]; then
            set -- "$@" --groups "$FIREBASE_TESTER_GROUPS"
          fi
          if [ -n "${FIREBASE_TESTER_EMAILS:-}" ]; then
            set -- "$@" --testers "$FIREBASE_TESTER_EMAILS"
          fi

          "$@"
